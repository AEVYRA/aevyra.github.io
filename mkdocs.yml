site_name: Aevyra Papers & Docs
site_url: https://aevyra.github.io/
site_description: "Foundational papers, documentation, and conceptual essays regarding the Aevyra architecture, synthetic intelligence, and temporal models."
theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: purple
  features:
    - navigation.sections

nav:
  - Home: index.md
  - Papers:
    - "The Tensor of Time": tensor-of-time.md

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.details

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
